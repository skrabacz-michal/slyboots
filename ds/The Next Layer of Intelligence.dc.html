<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fafafa; --muted:#a7a6a6; --nav:#b6b5b5; --strip:#8b8a8a;
  --pill:#ffffff; --pill-ink:#050505; --ease:cubic-bezier(.22,1,.36,1);
  --u:calc(100vh / 1058);
  --uw:calc(100vw / 1487);
  --h:clamp(var(--u), calc(var(--u) * .65 + var(--uw) * .35), calc(var(--u) * 1.16));
}
@supports (height:100dvh){ :root{ --u:calc(100dvh / 1058); } }
html,body{height:100%;margin:0;padding:0;background:#050505;overflow:hidden;}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:geometricPrecision;color:#fafafa;}
*{box-sizing:border-box;}
a{color:inherit;text-decoration:none;}
a:hover{color:#ffffff;}
@font-face{font-family:'IpsumMark';src:local('Manrope ExtraBold'),local('Manrope-ExtraBold');font-weight:700;font-display:swap;}

.stage{position:fixed;inset:0;overflow:hidden;background:#050505;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
.plate{position:absolute;inset:0;overflow:hidden;}
.plate-video{position:absolute;left:50%;top:calc(1 * var(--u));width:calc(1492 * var(--u));height:calc(1054 * var(--u));transform:translateX(calc(-50% - calc(0.5 * var(--u))));object-fit:cover;pointer-events:none;}
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;background:
 linear-gradient(to bottom, rgba(5,5,5,0) 78.8%, rgba(5,5,5,.23) 79.6%, rgba(5,5,5,.45) 81.4%, rgba(5,5,5,.75) 83.3%, rgba(5,5,5,.84) 85.2%, rgba(5,5,5,.888) 88%, rgba(5,5,5,.905) 91%, rgba(5,5,5,.96) 95%, #050505 100%),
 linear-gradient(to right, #050505 calc(50% - 746 * var(--u)), transparent calc(50% - 676 * var(--u)), transparent calc(50% + 676 * var(--u)), #050505 calc(50% + 746 * var(--u)));}

.topbar{position:absolute;inset:0;z-index:3;}
.brand{position:absolute;left:calc(75 * var(--u));top:calc(27 * var(--u));width:calc(31.5 * var(--u));height:calc(48.5 * var(--u));display:block;}
.brand svg{width:100%;height:100%;display:block;}
.links{position:absolute;left:50%;top:calc(51 * var(--u));transform:translate(-50%,-50%);display:flex;align-items:center;font-size:calc(19 * var(--u));font-weight:400;color:var(--nav);white-space:nowrap;}
.links a + a{margin-left:calc(24.5 * var(--u));}
.links a:nth-child(3){margin-left:calc(23.5 * var(--u));}
.links a:nth-child(4){margin-left:calc(26 * var(--u));}
.pill{display:inline-flex;align-items:center;justify-content:center;background:var(--pill);color:var(--pill-ink);border-radius:999px;font-weight:500;}
.pill-nav{position:absolute;right:calc(75.4 * var(--u));top:calc(27 * var(--u));width:calc(175 * var(--u));height:calc(49 * var(--u));font-size:calc(20.6 * var(--u));}
.pill-nav span{display:block;transform:translateY(calc(1 * var(--u)));}
.pill:hover{color:var(--pill-ink);}
.burger{display:none;}

.hero{position:absolute;inset:0;z-index:2;}
.headline{position:absolute;left:calc(75.5 * var(--u));top:calc(230.5 * var(--u));margin:0;font-size:calc(71.6 * var(--h));line-height:calc(80.5 * var(--h));font-weight:400;letter-spacing:calc(0.3 * var(--h));color:var(--ink);white-space:nowrap;}
.headline span{display:block;}
.sub{position:absolute;left:calc(75.5 * var(--u));top:calc(230.5 * var(--u) + 189 * var(--h));margin:0;font-size:calc(20.7 * var(--h));line-height:calc(23.5 * var(--h));font-weight:400;word-spacing:calc(1.8 * var(--h));color:var(--muted);}
.sub span{display:block;white-space:nowrap;}
.pill-cta{position:absolute;left:calc(74.9 * var(--u));top:calc(230.5 * var(--u) + 264.5 * var(--h));width:calc(175.6 * var(--h));height:calc(50 * var(--h));font-size:calc(20.6 * var(--h));}
.pill-cta span{display:block;transform:translateY(calc(1 * var(--h)));}
.ghost{position:absolute;left:calc(74.9 * var(--u) + 220.6 * var(--h));top:calc(230.5 * var(--u) + 279.5 * var(--h));font-size:calc(20.6 * var(--h));font-weight:500;letter-spacing:calc(0.12 * var(--h));color:#fff;}

.logos{position:absolute;z-index:2;left:50%;top:0;width:calc(741 * var(--u));height:100%;transform:translateX(calc(-50% + 20 * var(--u)));color:var(--strip);pointer-events:none;}
.lg{position:absolute;}
.lg svg{display:block;width:100%;height:100%;}
.lg .w{position:absolute;font-family:'IpsumMark','Manrope',sans-serif;font-weight:700;white-space:nowrap;line-height:1;}
.lg1{left:calc(-0.5 * var(--u));top:calc(994.7 * var(--u));width:calc(30.5 * var(--u));height:calc(31 * var(--u));}
.lg1 .w{left:calc(37 * var(--u));top:calc(5.6 * var(--u));font-size:calc(18.1 * var(--u));}
.lg2{left:calc(206.5 * var(--u));top:calc(995.7 * var(--u));width:calc(24.5 * var(--u));height:calc(30 * var(--u));}
.lg2 .w{left:calc(31 * var(--u));top:calc(7.3 * var(--u));font-size:calc(18.5 * var(--u));}
.lg3{left:calc(416.5 * var(--u));top:calc(996.7 * var(--u));width:calc(28.5 * var(--u));height:calc(28 * var(--u));}
.lg3 .w{left:calc(35 * var(--u));top:calc(7.3 * var(--u));font-size:calc(16.15 * var(--u));}
.lg4{left:calc(620.5 * var(--u));top:calc(998.7 * var(--u));width:calc(28.5 * var(--u));height:calc(25.5 * var(--u));}
.lg4 .w{left:calc(37 * var(--u));top:calc(8.3 * var(--u));font-size:calc(15.3 * var(--u));}
.dot{display:inline-block;width:.09em;height:.09em;border-radius:50%;background:currentColor;vertical-align:.62em;margin-left:.06em;}

.menu{position:absolute;inset:0;z-index:5;opacity:0;visibility:hidden;transition:opacity .42s var(--ease),visibility .42s var(--ease);background:linear-gradient(180deg,rgba(5,5,5,.94),rgba(5,5,5,.99));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;}
.stage.is-open .menu{opacity:1;visibility:visible;}
.menu-inner{margin:auto auto;width:100%;padding:calc(40 * var(--u)) calc(28 * var(--u));display:flex;flex-direction:column;gap:calc(18 * var(--u));}
.menu-eyebrow,.menu-list li,.menu-foot{opacity:0;transform:translateY(12px);transition:opacity .42s var(--ease),transform .42s var(--ease);}
.stage.is-open .menu-eyebrow{opacity:1;transform:none;transition-delay:.06s;}
.stage.is-open .menu-list li:nth-child(1){opacity:1;transform:none;transition-delay:.10s;}
.stage.is-open .menu-list li:nth-child(2){opacity:1;transform:none;transition-delay:.16s;}
.stage.is-open .menu-list li:nth-child(3){opacity:1;transform:none;transition-delay:.22s;}
.stage.is-open .menu-list li:nth-child(4){opacity:1;transform:none;transition-delay:.28s;}
.stage.is-open .menu-foot{opacity:1;transform:none;transition-delay:.34s;}
.menu-eyebrow{margin:0;font-size:max(13px,calc(13 * var(--u)));letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
.menu-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(10 * var(--u));}
.menu-list a{display:flex;align-items:baseline;gap:.4em;font-size:max(25px,calc(31 * var(--u)));font-weight:400;color:var(--ink);}
.menu-list a::after{content:"›";font-size:.5em;color:var(--muted);}
.menu-foot{display:flex;flex-direction:column;gap:calc(16 * var(--u));margin-top:calc(20 * var(--u));align-items:flex-start;}
.menu-foot .pill{height:max(48px,calc(52 * var(--u)));padding:0 calc(28 * var(--u));font-size:max(16px,calc(18 * var(--u)));}
.menu-foot .ghost{position:static;font-size:max(16px,calc(18 * var(--u)));}

@keyframes rise{from{opacity:0;transform:translateY(calc(14 * var(--u)));}}
@keyframes riseNav{from{opacity:0;transform:translate(-50%,calc(-50% + 14 * var(--u)));}to{opacity:1;transform:translate(-50%,-50%);}}
@keyframes fade{from{opacity:0;}}
@media (prefers-reduced-motion:no-preference){
  .brand,.pill-nav{animation:rise .8s var(--ease) both;}
  .links{animation:riseNav .8s var(--ease) both;}
  .headline{animation:rise .9s var(--ease) .06s both;}
  .sub{animation:rise .9s var(--ease) .14s both;}
  .pill-cta,.ghost{animation:rise .9s var(--ease) .22s both;}
  .lg{animation:fade 1.1s var(--ease) .34s both;}
}
@media (prefers-reduced-motion:reduce){
  .menu,.menu-eyebrow,.menu-list li,.menu-foot,.burger i{transition-duration:.001s !important;}
}

@media (max-aspect-ratio:11/10){
  :root{ --m:min(calc(100vw / 430), 1.34px); --u:var(--m); --h:var(--m); }
  .plate-video{inset:0;left:0;top:0;width:100%;height:100%;transform:none;object-position:43% center;}
  .plate::after{background:
    linear-gradient(to right, rgba(5,5,5,.86), rgba(5,5,5,.66) 42%, rgba(5,5,5,.20) 78%, rgba(5,5,5,.10) 100%),
    linear-gradient(to bottom, rgba(5,5,5,.72) 0%, rgba(5,5,5,.34) 24%, rgba(5,5,5,.34) 56%, rgba(5,5,5,.80) 82%, rgba(5,5,5,.97) 94%, #050505 100%);}
  .stage{display:flex;flex-direction:column;}
  .links,.pill-nav{display:none;}
  .topbar{position:relative;inset:auto;display:flex;align-items:center;justify-content:space-between;padding:calc(20 * var(--m)) calc(22 * var(--m)) 0;}
  .brand{position:static;width:calc(26 * var(--m));height:calc(40 * var(--m));}
  .burger{display:flex;position:relative;flex-direction:column;justify-content:center;gap:calc(6 * var(--m));width:calc(52 * var(--m));height:calc(44 * var(--m));border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);align-items:center;cursor:pointer;padding:0;z-index:6;}
  .burger i{display:block;width:calc(18 * var(--m));height:1.5px;background:#fafafa;transition:transform .3s var(--ease);}
  .stage.is-open .burger i:nth-child(1){transform:translateY(calc(4.3 * var(--m))) rotate(45deg);}
  .stage.is-open .burger i:nth-child(2){transform:translateY(calc(-4.3 * var(--m))) rotate(-45deg);}
  .hero{position:relative;inset:auto;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:calc(18 * var(--m));padding:calc(90 * var(--m)) calc(24 * var(--m)) 0;margin-top:auto;}
  .headline{position:static;white-space:normal;font-size:calc(46 * var(--m));line-height:calc(52 * var(--m));letter-spacing:0;}
  .headline span{display:inline;}
  .sub{position:static;font-size:calc(16 * var(--m));line-height:calc(24 * var(--m));word-spacing:normal;max-width:34ch;}
  .sub span{display:inline;white-space:normal;}
  .actions{display:flex;align-items:center;gap:calc(22 * var(--m));margin-top:calc(6 * var(--m));}
  .pill-cta{position:static;width:calc(165 * var(--m));height:calc(48 * var(--m));font-size:calc(17 * var(--m));}
  .ghost{position:static;font-size:calc(16 * var(--m));}
  .logos{position:relative;left:auto;top:auto;width:100%;height:auto;transform:none;display:grid;grid-template-columns:1fr 1fr;gap:calc(26 * var(--m)) calc(10 * var(--m));padding:calc(56 * var(--m)) calc(24 * var(--m)) calc(40 * var(--m));margin-top:auto;justify-items:start;}
  .lg{position:relative;left:auto !important;top:auto !important;width:calc(150 * var(--m));height:calc(30 * var(--m));}
  .lg svg{position:absolute;left:0;top:0;width:calc(26 * var(--m));height:calc(26 * var(--m));}
  .lg .w{left:calc(34 * var(--m)) !important;top:calc(6 * var(--m)) !important;font-size:calc(16 * var(--m)) !important;}
}
@media (min-width:600px) and (max-aspect-ratio:11/10){
  :root{ --m:min(calc(100vw / 860), calc(100vh / 760), 1.25px); }
  .plate-video{object-position:44% center;}
  .plate::after{background:
    linear-gradient(to right, rgba(5,5,5,.84), rgba(5,5,5,.60) 42%, rgba(5,5,5,.16) 78%, rgba(5,5,5,.06) 100%),
    linear-gradient(to bottom, rgba(5,5,5,.66) 0%, rgba(5,5,5,.28) 24%, rgba(5,5,5,.30) 56%, rgba(5,5,5,.78) 82%, rgba(5,5,5,.96) 94%, #050505 100%);}
  .headline{font-size:calc(64 * var(--m));line-height:calc(72 * var(--m));white-space:nowrap;}
  .headline span{display:block;}
  .sub{font-size:calc(19 * var(--m));line-height:calc(26 * var(--m));max-width:none;}
  .sub span{display:block;}
  .logos{grid-template-columns:repeat(4,1fr);}
}
</style>
</helmet>
<div class="stage" id="stage">
  <div class="plate">
    <video class="plate-video" autoplay="" muted="" loop="" playsinline="" preload="auto" aria-hidden="true">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260808_112712_da9d53df-6d27-4b12-bdf6-aa9dc2622bdf.mp4" type="video/mp4">
    </video>
  </div>

  

  <nav class="menu" id="menu" aria-hidden="true">
    <div class="menu-inner">
      <p class="menu-eyebrow">Menu</p>
      <ul class="menu-list">
        <li><a href="#about">About</a></li>
        <li><a href="#features">Features</a></li>
        <li><a href="#faq">FAQ</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <div class="menu-foot">
        <a class="pill" href="#get-started"><span>Get Started</span></a>
        <a class="ghost" href="#architecture">View Architecture</a>
      </div>
    </div>
  </nav>

  

  <div class="logos">
    <div class="lg lg1">
      
      <span class="w"><br></span>
    </div>
    <div class="lg lg2">
      
      <span class="w"><br></span>
    </div>
    <div class="lg lg3">
      
      <span class="w"><br></span>
    </div>
    <div class="lg lg4">
      
      <span class="w"><br></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  componentDidMount() {
    const stage = document.getElementById('stage');
    const burger = document.getElementById('burger');
    const menu = document.getElementById('menu');
    const v = document.querySelector('.plate-video');
    if (v) { v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true; v.autoplay = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    if (!stage || !burger || !menu) return;
    const set = (open) => {
      stage.classList.toggle('is-open', open);
      burger.setAttribute('aria-expanded', String(open));
      burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      menu.setAttribute('aria-hidden', String(!open));
    };
    this._off = [];
    const on = (el, ev, fn) => { el.addEventListener(ev, fn); this._off.push(() => el.removeEventListener(ev, fn)); };
    on(burger, 'click', () => set(!stage.classList.contains('is-open')));
    on(document, 'keydown', (e) => { if (e.key === 'Escape') set(false); });
    menu.querySelectorAll('a').forEach(a => on(a, 'click', () => set(false)));
    on(window, 'resize', () => { if (window.innerWidth / window.innerHeight > 1.1) set(false); });
  }
  componentWillUnmount() { (this._off || []).forEach(f => f()); }
  renderVals() { return {}; }
}
</script>
</body>
</html>

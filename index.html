<div class="stage">
  <div class="plate">
    <!-- the clip does not loop seamlessly; js/main.js dips it to black at the

  <!-- pointer-only hitbox over the portal itself; the sigil below remains
       the accessible/keyboard entrance, so this stays out of the a11y tree -->

  <button class="enter" id="enter" type="button" aria-label="Enter">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" aria-hidden="true">
      <path d="M32 44 C 22 32, 22 16, 36 6 C 28 22, 32 34, 40 42"/>

    </svg>
  </button>
</div>

  <button class="join-back" id="join-back" type="button" aria-label="Go back through the door">
    <svg viewBox="0 0 20 14" width="18" height="13" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 7 H2 M8 1 L2 7 L8 13"/>
    </svg>
  </button>
  <div class="join-inner">
    <form id="join-form" novalidate>
      <h1>Welcome, apostate.</h1>
      <p class="join-sub">The Church of Slyboots keeps a Ledger. Your name goes in it.</p>
      <div class="field">
        <label for="j-name">Your name</label>
        <input type="text" id="j-name" name="name" required autocomplete="name">
        <p class="field-error" role="alert" hidden>The Ledger requires a name.</p>
      </div>
      <div class="field">
        <label for="j-email">Your email</label>
        <input type="email" id="j-email" name="email" required autocomplete="email">
        <p class="field-error" role="alert" hidden>A working address, apostate.</p>
      </div>
      <button class="join-submit" type="submit">Join the Church</button>
      <p class="form-error" role="alert" hidden>The Ledger did not open. Try again.</p>
    </form>
    <div class="join-done" id="join-done" role="status" hidden>
      <h1>It is done.</h1>
      <p class="join-sub">The Ledger holds your name. The Church will write when there is something worth writing.</p>
    </div>
  </div>
  <div class="veil" aria-hidden="true"></div>
</section>
